<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShaanU | Unified Placement Ecosystem</title>
    
    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#1e3c72">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ShaanU">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2997/2997300.png">
    
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Core Engine Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue3-sfc-loader/dist/vue3-sfc-loader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --shaanu-blue: #1e3c72;
            --shaanu-blue-light: #2a5298;
            --shaanu-gold: #ffc107;
            --shaanu-bg: #f8fafd;
            --shaanu-card-shadow: 0 10px 30px rgba(30, 60, 114, 0.05);
        }

        [data-bs-theme="dark"] {
            --shaanu-bg: #121212;
            --shaanu-card-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--shaanu-bg);
            color: var(--bs-body-color);
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Responsive Layout Utilities */
        .workspace-content {
            flex: 1;
            padding-bottom: 80px; /* Space for mobile nav if needed */
        }

        @media (min-width: 992px) {
            .workspace-content { padding-bottom: 20px; }
        }

        /* PWA Install Banner */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            width: 90%;
            max-width: 400px;
            background: var(--shaanu-blue);
            color: white;
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp { from { bottom: -100px; } to { bottom: 200px; } }

        /* Loading Animation */
        .system-loader {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--shaanu-bg);
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(30, 60, 114, 0.1);
            border-top: 4px solid var(--shaanu-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; }
    </style>
</head>
<body>
    <div id="app">
        <!-- PWA INSTALL PROMPT -->
        <div v-if="deferredPrompt" class="install-banner">
            <div class="d-flex align-items-center">
                <i class="fas fa-mobile-alt me-3 fa-lg"></i>
                <div class="small">
                    <div class="fw-bold">Add to Home Screen</div>
                    <div class="opacity-75">Fast access to ShaanU</div>
                </div>
            </div>
            <button class="btn btn-light btn-sm rounded-pill px-3 fw-bold" @click="installPWA">Install</button>
        </div>

        <!-- GLOBAL LOADER -->
        <transition name="fade">
            <div v-if="!isSystemReady" class="system-loader">
                <div class="loader-ring mb-4"></div>
                <h5 class="fw-bold text-primary">ShaanU</h5>
            </div>
        </transition>

        <!-- MAIN ENGINE -->
        <template v-if="isSystemReady">
            <div v-if="!isLoggedIn" class="auth-wrapper container py-4 py-md-5">
                <auth-component @login-success="handleLoginSuccess"></auth-component>
            </div>

            <div v-else class="app-workspace d-flex flex-column min-vh-100">
                <dashboard-component @logout="handleLogout"></dashboard-component>
            </div>
        </template>
    </div>

    <script>
        const { loadModule } = window['vue3-sfc-loader'];

        const loaderOptions = {
            moduleCache: { vue: Vue },
            async getFile(url) {
                const res = await fetch(url);
                if (!res.ok) throw Object.assign(new Error(res.statusText + ' ' + url), { res });
                return { getContentData: (asBinary) => asBinary ? res.arrayBuffer() : res.text() };
            },
            addStyle(textContent) {
                const style = Object.assign(document.createElement('style'), { textContent });
                document.head.appendChild(style);
            },
        };

        const app = Vue.createApp({
            data() {
                return {
                    isSystemReady: false,
                    isLoggedIn: !!localStorage.getItem('shaanu_token'),
                    deferredPrompt: null
                }
            },
            methods: {
                handleLoginSuccess(data) {
                    localStorage.setItem('shaanu_token', data.token || data.access_token);
                    localStorage.setItem('shaanu_role', data.role);
                    localStorage.setItem('shaanu_user', data.username);
                    localStorage.setItem('shaanu_email', data.email);
                    this.isLoggedIn = true;
                },
                handleLogout() {
                    localStorage.clear();
                    this.isLoggedIn = false;
                    window.location.reload();
                },
                installPWA() {
                    if (!this.deferredPrompt) return;
                    this.deferredPrompt.prompt();
                    this.deferredPrompt.userChoice.then((choiceResult) => {
                        if (choiceResult.outcome === 'accepted') {
                            console.log('User accepted institutional install');
                        }
                        this.deferredPrompt = null;
                    });
                }
            },
            mounted() {
                setTimeout(() => { this.isSystemReady = true; }, 600);

                // --- PWA Installation Logic ---
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredPrompt = e;
                });

                window.addEventListener('appinstalled', () => {
                    this.deferredPrompt = null;
                    console.log('ShaanU App successfully installed on desktop/mobile.');
                });

                // Sync theme on mount
                const theme = localStorage.getItem('shaanu_theme') || 'light';
                document.body.setAttribute('data-bs-theme', theme);
            }
        });

        // Global Component Registration
        const register = (name, path) => {
            app.component(name, Vue.defineAsyncComponent(() => loadModule(path, loaderOptions)));
        };

        register('auth-component', '/components/AuthComponent.vue');
        register('dashboard-component', '/components/DashboardComponent.vue');
        register('navbar', '/components/Navbar.vue');
        register('admin-dashboard', '/components/AdminDashboard.vue');
        register('student-dashboard', '/components/StudentDashboard.vue');
        register('company-dashboard', '/components/CompanyDashboard.vue');
        register('chart-component', '/components/ChartComponent.vue');
        register('notification-bell', '/components/NotificationBell.vue');
        register('theme-toggle', '/components/ThemeToggle.vue');

        app.mount('#app');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
